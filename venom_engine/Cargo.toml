[package]
name = "venom_engine_dome"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
ring = { version = "0.17", features = ["alloc", "dev_urandom_fallback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
